<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="香港迪士尼樂園各設施即時排隊等候時間，互動地圖 + 等候清單 + 園區繁忙度分析，每5分鐘自動更新。">
<meta property="og:title" content="香港迪士尼樂園 即時等候時間">
<meta property="og:description" content="即時排隊等候時間 + 互動地圖 + 園區繁忙度分析">
<meta property="og:url" content="https://disneyland.we1co.me/">
<meta property="og:type" content="website">
<title>香港迪士尼樂園 即時等候時間 | HK Disneyland Wait Times</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--sub:#94a3b8;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;--purple:#a855f7;--border:#334155}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  #map{flex:0 0 50vh;min-height:300px;z-index:1}
  .panel{flex:1;overflow-y:auto;padding:0 12px 80px}
  .header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;flex-shrink:0}
  .header h1{font-size:1rem;font-weight:600;white-space:nowrap}
  .header h1 span{font-size:.7rem;color:var(--sub);margin-left:6px}
  .refresh{background:none;border:1px solid var(--border);color:var(--sub);border-radius:6px;padding:4px 10px;font-size:.75rem;cursor:pointer}
  .park-info{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin:8px 12px 0;font-size:.78rem;color:var(--sub)}
  .park-info b{color:var(--text)}
  .updated{text-align:center;font-size:.65rem;color:var(--sub);padding:6px 0 4px}
  .land-strip{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .land-strip::-webkit-scrollbar{display:none}
  .land-chip{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-width:80px;text-align:center;cursor:default;transition:transform .1s}
  .land-chip.busy{border-color:var(--amber);transform:scale(1.03)}
  .land-chip .lzh{font-size:.75rem;font-weight:600;white-space:nowrap}
  .land-chip .lavg{font-size:1rem;font-weight:700;margin-top:2px}
  .land-chip .lcnt{font-size:.6rem;color:var(--sub)}
  .land-chip.busy .lavg{color:var(--amber)}
  .filter-bar{display:flex;gap:6px;padding:8px 0 12px;overflow-x:auto;flex-shrink:0}
  .filter-bar button{background:var(--card);border:1px solid var(--border);color:var(--sub);border-radius:8px;padding:4px 12px;font-size:.72rem;white-space:nowrap;cursor:pointer;transition:all .15s}
  .filter-bar button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .list{display:flex;flex-direction:column;gap:6px}
  .item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .item .name{font-size:.85rem;line-height:1.3}
  .item .name small{color:var(--sub);font-size:.65rem;display:block;margin-top:1px}
  .item .name .land-tag{font-size:.6rem;color:var(--blue);display:inline-block}
  .item .wait{text-align:right;white-space:nowrap}
  .item .wait .time{font-size:1.2rem;font-weight:700;line-height:1}
  .item .wait .label{font-size:.55rem;color:var(--sub);text-transform:uppercase;letter-spacing:.03em}
  .item.waiting .time{color:var(--amber)}
  .item.nowait .time{color:var(--green)}
  .item.no-wait-label .label{color:var(--green)}
  .spark{grid-column:1/-1;margin-top:4px;border-radius:6px;background:rgba(0,0,0,.2);padding:4px 6px;display:none}
  .item.show-spark .spark{display:block}
  .spark svg{width:100%;height:28px}
  .spark .strend{font-size:.6rem;color:var(--sub);margin-top:2px}
  .badge{display:inline-block;padding:1px 5px;border-radius:4px;font-size:.58rem;font-weight:600;margin-top:3px;vertical-align:middle}
  .badge.RIDE{background:#312e81;color:#a5b4fc}
  .badge.MEET{background:#701a75;color:#f5d0fe}
  .badge.FOOD{background:#78350f;color:#fcd34d}
  .badge.SHOW{background:#7c2d12;color:#fed7aa}
  .badge.OTHER{background:#1e293b;color:#94a3b8}
  .section-title{font-size:.72rem;color:var(--sub);font-weight:600;padding:8px 0 6px;text-transform:uppercase;letter-spacing:.04em}
  .empty{text-align:center;color:var(--sub);padding:40px 0;font-size:.85rem}
  .tab-bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--border);z-index:2;padding-bottom:env(safe-area-inset-bottom,0px)}
  .tab-bar button{flex:1;padding:10px 0;background:none;border:none;color:var(--sub);font-size:.7rem;cursor:pointer}
  .tab-bar button:focus-visible,.filter-bar button:focus-visible,.refresh:focus-visible,.locate-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .tab-bar button.on{color:var(--blue)}
  .tab-bar button svg{display:block;margin:0 auto 2px;width:20px;height:20px;fill:currentColor}
  .locate-btn{position:absolute;right:10px;bottom:120px;z-index:1000;width:34px;height:34px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:#3b82f6;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .locate-btn:active{transform:scale(.95)}
  .locate-btn.locating{color:var(--amber)}
  .hidden{display:none!important}
  @media(min-width:700px){#map{flex:0 0 60vh}.list{columns:2;column-gap:10px} .item{break-inside:avoid}}
</style>
</head>
<body>
<div class="header">
  <h1>🏰 香港迪士尼樂園<span>即時等候</span></h1>
  <button class="refresh" onclick="loadData()" title="更新">🔄</button>
</div>
<div id="map">
  <div class="locate-btn" id="locateBtn" onclick="locateMe()" title="顯示我的位置">📍</div>
</div>
<div class="panel" id="listPanel">
  <div class="park-info" id="parkInfo"></div>
  <div class="updated" id="updatedAt"></div>
  <div class="land-strip" id="landStrip"></div>
  <div class="filter-bar" id="filterBar"></div>
  <div class="list" id="list"><div class="loading">載入中…</div></div>
</div>
<div class="tab-bar">
  <button id="tabList" class="on" onclick="showTab('list')">
    <svg viewBox="0 0 24 24"><path d="M3 4h18v2H3zm0 7h18v2H3zm0 7h18v2H3z"/></svg> 清單
  </button>
  <button id="tabMap" onclick="showTab('map')">
    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg> 地圖
  </button>
</div>
<script>
let DATA=null, MAP=null, markers={};
const TYPE_FILTERS=['ride','meet','food','other'];
let activeType=new Set(TYPE_FILTERS);
const TYPE_LABEL={ride:'🎢 遊樂設施',meet:'🤝 角色會面',food:'🍽️ 餐飲',other:'📍 其他'};
const TYPE_HASH={ride:'RIDE',meet:'MEET',food:'FOOD',other:'OTHER'};
const COLORS={Operating:'#22c55e','Planned Closure':'#ef4444','Closed':'#ef4444','Refurbishment':'#f59e0b','Temporarily Closed':'#ef4444'};
const ZH_STATUS={Operating:'營運中','Closed':'已關閉','Refurbishment':'維修中','Planned Closure':'預約關閉'};

function rideType(a){
  const n=(a.nameZh||a.name).toLowerCase();
  if(a.type==='RESTAURANT'||n.includes('cafe')||n.includes('restaurant')||n.includes('inn'))return 'food';
  if(n.includes('會面'))return 'meet';
  return (a.status==='Operating'&&a.waitTime!==null)?'ride':'other';
}
function statusColor(s){return COLORS[s]||'#64748b'}
function waitClass(w){return w===null?'no-wait':w<=15?'nowait':'waiting'}
function waitMins(w){return w===null?'—':w+'′'}
function waitLabel(w){return w===null?'已關閉':w===0?'即場上車':'等候'}
function fmtTime(iso){
  if(!iso)return'';
  const m=iso.match(/T(\d{2}):(\d{2})/);
  return m?m[1]+':'+m[2]:'';
}
// trend sparkline SVG — compact for mobile
function sparkSVG(samples){
  // samples = [{t:'HH:MM', data:{rideId:wait}}]
  if(!samples||samples.length<2)return'';
  // use rideName key to find current data? No — history keyed by id
  // We'll aggregate average across rides that have data
  const avgs=samples.map(s=>{
    const vals=Object.values(s.data).filter(v=>v!==null);
    return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null;
  });
  const valid=avgs.filter(v=>v!==null);
  if(valid.length<2)return'';
  const max=Math.max(...valid,10);
  const W=120, H=24;
  const pts=avgs.map((v,i)=>{
    if(v===null)return null;
    return(i*W/(avgs.length-1))+','+(H - (v/max)*H);
  }).filter(Boolean);
  return`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <polyline points="${pts.join(' ')}" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1].split(',')[0]}" cy="${pts[pts.length-1].split(',')[1]}" r="2" fill="#3b82f6"/>
  </svg>`;
}
function sparkLabel(samples){
  if(!samples||samples.length<2)return'';
  const avgs=samples.map(s=>{const v=Object.values(s.data).filter(v=>v!==null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null;}).filter(v=>v!==null);
  if(avgs.length<2)return'';
  const diff=avgs[avgs.length-1]-avgs[0];
  if(diff>10)return'↑ 變長 '+diff+'′';
  if(diff<-10)return'↓ 變短 '+Math.abs(diff)+'′';
  return'→ 穩定';
}

async function loadData(){
  try{
    const r=await fetch('./data/hkdl.json?t='+Date.now());
    DATA=await r.json();
    renderParkInfo();renderFilters();renderLandStrip();renderList();
    updateTime();updateMapMarkers();
  }catch(e){document.getElementById('list').innerHTML='<div class="empty">❌ 載入失敗</div>';}
}

function renderParkInfo(){
  if(!DATA)return;
  const o=DATA.openingTime?fmtTime(DATA.openingTime):'—';
  const c=DATA.closingTime?fmtTime(DATA.closingTime):'—';
  let closingNote='';
  if(DATA.closingTime){
    const mins=Math.max(0,Math.floor((new Date(DATA.closingTime)-new Date())/60000));
    closingNote=mins>0?`<b>${Math.floor(mins/60)}h${mins%60}m 後閉園</b>`:'<b>已閉園</b>';
  }
  document.getElementById('parkInfo').innerHTML=`📅 營業時間 <b>${o} – ${c}</b>${closingNote?' · '+closingNote:''}`;
}

function renderLandStrip(){
  if(!DATA||!DATA.lands)return;
  const el=document.getElementById('landStrip');
  const maxAvg=Math.max(...DATA.lands.map(l=>l.avgWait),1);
  el.innerHTML=DATA.lands.filter(l=>l.rides>0).map(l=>{
    const busy=l.avgWait>maxAvg*0.6;
    return`<div class="land-chip${busy?' busy':''}">
      <div class="lzh">${l.nameZh}</div>
      <div class="lavg" style="color:${busy?'var(--amber)':'var(--text)'}">${l.avgWait}′</div>
      <div class="lcnt">${l.rides} rides</div>
    </div>`;
  }).join('');
}

function renderFilters(){
  const bar=document.getElementById('filterBar');
  bar.innerHTML=TYPE_FILTERS.map(t=>
    `<button data-type="${t}" class="${activeType.has(t)?'on':''}" onclick="toggleType('${t}')">${TYPE_LABEL[t]}</button>`
  ).join('');
}
function toggleType(t){activeType.has(t)?activeType.delete(t):activeType.add(t);renderFilters();renderList();updateMapMarkers()}

function filtered(){
  if(!DATA)return[];
  return DATA.attractions.filter(a=>activeType.has(rideType(a)))
    .sort((a,b)=>{
      if(a.waitTime===null&&b.waitTime!==null)return 1;
      if(a.waitTime!==null&&b.waitTime===null)return-1;
      return(a.waitTime||999)-(b.waitTime||999);
    });
}

function renderList(){
  const el=document.getElementById('list');
  const items=filtered();
  if(!items.length){el.innerHTML='<div class="empty">冇符合條件嘅設施</div>';return}
  el.innerHTML=items.map(a=>{
    const rt=rideType(a);
    const h=DATA.history;
    const spark=h?h.filter(s=>s.data[a.id]!==undefined):[];
    const hasTrend=spark.length>=2&&spark.some(s=>s.data[a.id]!==null);
    return`<div class="item ${waitClass(a.waitTime)} ${hasTrend?'show-spark':''}" data-id="${a.id}">
      <div class="dot" style="background:${statusColor(a.status)}" title="${ZH_STATUS[a.status]||a.status}"></div>
      <div class="name">${a.nameZh}<small>${a.name}</small><span class="land-tag">${a.land||''}</span>
        <span class="badge ${TYPE_HASH[rt]}">${rt.toUpperCase()}</span>
      </div>
      <div class="wait"><div class="time">${waitMins(a.waitTime)}</div><div class="label">${waitLabel(a.waitTime)}</div></div>
      ${hasTrend?`<div class="spark"><span class="strend">${sparkLabel(spark)}</span>${sparkSVG(spark)}</div>`:''}
    </div>`;
  }).join('');
}

function updateTime(){
  document.getElementById('updatedAt').innerHTML=DATA?`最後更新：${DATA.updated}`:'';
}

// --- MAP ---
function initMap(){
  MAP=L.map('map',{zoomControl:false,attributionControl:true}).setView([22.3125,114.042],17);
  L.control.zoom({position:'bottomright'}).addTo(MAP);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM',maxZoom:19}).addTo(MAP);
}
function updateMapMarkers(){
  if(!MAP||!DATA)return;
  Object.values(markers).forEach(m=>MAP.removeLayer(m));
  markers={};
  filtered().forEach(a=>{
    if(!a.lat)return;
    const c=statusColor(a.status);
    const h=`<div style="background:${c};color:#fff;border-radius:8px;padding:2px 6px;font-size:11px;font-weight:700;white-space:nowrap;border:2px solid rgba(0,0,0,.3)">${a.waitTime!==null?a.waitTime+'′':'—'}</div>`;
    const icon=L.divIcon({html:h,className:'',iconSize:[36,22],iconAnchor:[18,11]});
    const m=L.marker([a.lat,a.lon],{icon}).addTo(MAP);
    m.bindPopup(`<b>${a.nameZh}</b><br>${a.name}<br>${ZH_STATUS[a.status]||a.status}${a.waitTime!==null?'<br><b>'+a.waitTime+' 分鐘</b>':''}<br><small>${a.land||''}</small>`);
    markers[a.id]=m;
  });
}
function showTab(t){
  document.getElementById('tabList').classList.toggle('on',t==='list');
  document.getElementById('tabMap').classList.toggle('on',t==='map');
  document.getElementById('listPanel').classList.toggle('hidden',t==='map');
  if(t==='map'&&MAP)setTimeout(()=>MAP.invalidateSize(),100);
}

// --- 我的位置 (geolocation) ---
let userMarker=null, userCircle=null;
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.asin(Math.sqrt(a));
}
function nearestRide(lat,lon){
  if(!DATA)return null;
  let best=null,bestD=1e9;
  for(const a of DATA.attractions){
    if(!a.lat||a.type!=='ATTRACTION')continue;
    const d=haversineKm(lat,lon,a.lat,a.lon);
    if(d<bestD){bestD=d;best=a;}
  }
  return best?{ride:best,km:bestD}:null;
}
function locateMe(){
  const btn=document.getElementById('locateBtn');
  if(!navigator.geolocation){btn.style.color='var(--red)';return}
  btn.classList.add('locating');
  btn.innerHTML='⏳';
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:lat,longitude:lon}=pos.coords;
    const acc=pos.coords.accuracy||30;
    // remove old
    if(userMarker)MAP.removeLayer(userMarker);
    if(userCircle)MAP.removeLayer(userCircle);
    userCircle=L.circle([lat,lon],{radius:acc,color:'#3b82f6',fillColor:'#3b82f6',fillOpacity:.12,weight:1}).addTo(MAP);
    const icon=L.divIcon({html:`<div style="width:14px;height:14px;background:#3b82f6;border:3px solid #fff;border-radius:50%;box-shadow:0 0 10px rgba(59,130,246,.8)"></div>`,className:'',iconSize:[14,14],iconAnchor:[7,7]});
    userMarker=L.marker([lat,lon],{icon}).addTo(MAP);
    const near=nearestRide(lat,lon);
    const popup=near
      ?`<b>我的位置</b><br>附近：${near.ride.nameZh}（${Math.round(near.km*1000)}m）<br>等候：${near.ride.waitTime!==null?near.ride.waitTime+' 分鐘':'—'}`
      :`<b>我的位置</b>`;
    userMarker.bindPopup(popup).openPopup();
    MAP.setView([lat,lon],17);
    btn.classList.remove('locating');
    btn.innerHTML='📍';
  },err=>{
    btn.classList.remove('locating');
    btn.innerHTML='📍';
    btn.style.color='var(--red)';
    setTimeout(()=>btn.style.color='#3b82f6',2000);
  },{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
initMap();
loadData();
setInterval(loadData,5*60*1000);
</script>
</body>
</html>
